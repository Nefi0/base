<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320">
  <defs>
    <!-- Wood grain texture via filters -->
    <filter id="wood" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.18" numOctaves="4" seed="3" result="noise"/>
      <feColorMatrix type="matrix"
        values="0.6 0.3 0.1 0 0.55
                0.4 0.25 0.05 0 0.32
                0.1 0.05 0.02 0 0.08
                0   0    0    1 0"
        in="noise" result="coloredNoise"/>
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Rivet gradient -->
    <radialGradient id="rivet" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d0cfc8"/>
      <stop offset="40%" stop-color="#8a8880"/>
      <stop offset="100%" stop-color="#4a4845"/>
    </radialGradient>

    <!-- Rivet pattern (grid knurl) -->
    <pattern id="knurl" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#8a8880"/>
      <rect x="0" y="0" width="2" height="2" fill="#6a6865"/>
      <rect x="2" y="2" width="2" height="2" fill="#6a6865"/>
    </pattern>

    <clipPath id="oval-clip">
      <ellipse cx="270" cy="160" rx="255" ry="148"/>
    </clipPath>

    <!-- Emboss filter for text -->
    <filter id="emboss">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feOffset dx="1" dy="2" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <!-- Dark brown outer border -->
  <ellipse cx="270" cy="160" rx="262" ry="155" fill="#2a1408"/>

  <!-- Wood base fill -->
  <ellipse cx="270" cy="160" rx="255" ry="148" fill="#D4952A"/>

  <!-- Wood grain overlay -->
  <ellipse cx="270" cy="160" rx="255" ry="148" fill="#C8881F" filter="url(#wood)" opacity="0.9"/>

  <!-- Subtle inner shadow at border -->
  <ellipse cx="270" cy="160" rx="255" ry="148" fill="none" stroke="#1a0a02" stroke-width="6" opacity="0.4"/>

  <!-- Text "ЛЕМБЕР" -->
  <text
    x="270" y="190"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="118"
    font-weight="900"
    fill="#2a0e05"
    filter="url(#emboss)"
    letter-spacing="-2"
  >ЛЕМБЕР</text>

  <!-- Left rivet -->
  <circle cx="58" cy="160" r="18" fill="url(#rivet)"/>
  <circle cx="58" cy="160" r="18" fill="url(#knurl)" opacity="0.6"/>
  <circle cx="58" cy="160" r="18" fill="none" stroke="#2a2825" stroke-width="1.5"/>
  <!-- rivet highlight -->
  <ellipse cx="53" cy="154" rx="5" ry="3" fill="white" opacity="0.25"/>

  <!-- Right rivet -->
  <circle cx="482" cy="160" r="18" fill="url(#rivet)"/>
  <circle cx="482" cy="160" r="18" fill="url(#knurl)" opacity="0.6"/>
  <circle cx="482" cy="160" r="18" fill="none" stroke="#2a2825" stroke-width="1.5"/>
  <ellipse cx="477" cy="154" rx="5" ry="3" fill="white" opacity="0.25"/>
</svg>
