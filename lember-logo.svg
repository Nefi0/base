<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 590">
  <defs>
    <!-- Wood grain -->
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.22" numOctaves="5" seed="7" result="n"/>
      <feColorMatrix type="matrix"
        values="0.55 0.28 0.08 0 0.50
                0.38 0.22 0.04 0 0.28
                0.08 0.04 0.01 0 0.06
                0    0    0    1 0"
        in="n" result="c"/>
      <feBlend in="SourceGraphic" in2="c" mode="multiply"/>
    </filter>

    <!-- Oval clip -->
    <clipPath id="ovalClip">
      <ellipse cx="522" cy="295" rx="500" ry="272"/>
    </clipPath>

    <!-- Rivet radial gradient -->
    <radialGradient id="riv" cx="35%" cy="30%" r="65%">
      <stop offset="0%"  stop-color="#ccc9c0"/>
      <stop offset="45%" stop-color="#807d76"/>
      <stop offset="100%" stop-color="#3c3a36"/>
    </radialGradient>

    <!-- Rivet knurl pattern -->
    <pattern id="knurl" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#7a7870"/>
      <rect x="0" y="0" width="3" height="3" fill="#606058"/>
      <rect x="3" y="3" width="3" height="3" fill="#606058"/>
    </pattern>
  </defs>

  <!-- ── LAYER 1: BACKGROUND (oval + wood) ── -->
  <g id="background">
    <!-- Dark border ring -->
    <ellipse cx="522" cy="295" rx="516" ry="284" fill="#1e0b02"/>
    <!-- Wood fill -->
    <ellipse cx="522" cy="295" rx="500" ry="272" fill="#D08B1E"/>
    <!-- Wood grain overlay -->
    <ellipse cx="522" cy="295" rx="500" ry="272" fill="#C07A10" filter="url(#grain)" opacity="0.85"/>
    <!-- Inner border shadow -->
    <ellipse cx="522" cy="295" rx="500" ry="272" fill="none" stroke="#12060080" stroke-width="10"/>
  </g>

  <!-- ── LAYER 2: RIVETS ── -->
  <g id="rivets">
    <!-- Left rivet -->
    <circle cx="104" cy="295" r="32" fill="url(#riv)"/>
    <circle cx="104" cy="295" r="32" fill="url(#knurl)" opacity="0.55"/>
    <circle cx="104" cy="295" r="32" fill="none" stroke="#1a1810" stroke-width="2"/>
    <ellipse cx="96" cy="285" rx="9" ry="5" fill="white" opacity="0.22"/>
    <!-- Right rivet -->
    <circle cx="940" cy="295" r="32" fill="url(#riv)"/>
    <circle cx="940" cy="295" r="32" fill="url(#knurl)" opacity="0.55"/>
    <circle cx="940" cy="295" r="32" fill="none" stroke="#1a1810" stroke-width="2"/>
    <ellipse cx="932" cy="285" rx="9" ry="5" fill="white" opacity="0.22"/>
  </g>

  <!-- ── LAYER 3: TEXT (top — use as counterform) ── -->
  <g id="text-layer">
    <text
      x="522"
      y="372"
      text-anchor="middle"
      font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
      font-size="240"
      font-weight="900"
      fill="#1e0b02"
      letter-spacing="-4"
    >ЛЕМБЕР</text>
  </g>
</svg>
