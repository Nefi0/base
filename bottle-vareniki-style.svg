<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 460">
  <!-- ══ БУТЫЛКА В СТИЛЕ "ВАРЕНИКА" ══
       4 тона из деревянной палитры, грубый "вырезанный" контур,
       тени — пятна-мазки поверх плоского силуэта (не градиент)
  -->

  <!-- Тон 1 (самый светлый — блик): кремовый -->
  <!-- Тон 2 (база — основной силуэт): светлый дуб -->
  <!-- Тон 3 (тень): янтарный -->
  <!-- Тон 4 (глубокая тень / контур): тёмно-коричневый -->

  <!-- БАЗА — плоский силуэт бутылки, тон 2 -->
  <path fill="#E0A85A" d="
    M 88 18
    C 84 18 80 22 80 30
    L 79 70
    C 60 92 52 110 52 145
    L 50 250
    C 49 290 49 360 50 410
    C 50 432 56 444 78 446
    L 122 446
    C 144 444 150 432 150 410
    C 151 360 151 290 150 250
    L 148 145
    C 148 110 140 92 121 70
    L 120 30
    C 120 22 116 18 112 18
    Z
  "/>

  <!-- ТЕНЬ 1 (мазок слева, тон 3 — янтарный) -->
  <path fill="#C9821E" opacity="0.85" d="
    M 60 130
    C 56 180 55 260 56 340
    C 57 390 58 425 64 442
    L 82 444
    C 74 420 72 380 71 330
    C 70 250 70 180 74 132
    C 70 128 64 127 60 130
    Z
  "/>

  <!-- ТЕНЬ 2 (горлышко, тон 3) -->
  <path fill="#C9821E" opacity="0.8" d="
    M 82 36 L 81 68 C 75 78 70 88 67 100
    C 78 92 92 90 105 96
    C 100 82 96 70 96 60
    L 96 36 Z
  "/>

  <!-- ГЛУБОКАЯ ТЕНЬ (контур-обводка, грубая, тон 4) -->
  <path fill="none" stroke="#3B2410" stroke-width="5" stroke-linejoin="round"
        d="
    M 88 18
    C 84 18 80 22 80 30
    L 79 70
    C 60 92 52 110 52 145
    L 50 250
    C 49 290 49 360 50 410
    C 50 432 56 444 78 446
    L 122 446
    C 144 444 150 432 150 410
    C 151 360 151 290 150 250
    L 148 145
    C 148 110 140 92 121 70
    L 120 30
    C 120 22 116 18 112 18
    Z
  "/>

  <!-- ЭТИКЕТКА — мазок-блик, тон 1 (кремовый, самый светлый) -->
  <path fill="#F2DDB0" opacity="0.9" d="
    M 56 270
    C 70 264 130 264 144 271
    C 146 300 146 330 144 358
    C 130 365 70 365 56 358
    C 54 330 54 298 56 270
    Z
  "/>

  <!-- Овал-печать на этикетке (тон 4, тёмный, как у вареника защип) -->
  <ellipse cx="100" cy="318" rx="22" ry="20" fill="none" stroke="#3B2410" stroke-width="3"/>

  <!-- Блик на стекле — небольшой светлый мазок справа (тон 1) -->
  <path fill="#F2DDB0" opacity="0.55" d="
    M 122 150 C 126 220 127 320 124 410
    C 130 320 130 220 128 150 Z
  "/>

  <!-- Блик на крышке/горле (тон 1) -->
  <ellipse cx="96" cy="40" rx="13" ry="6" fill="#F2DDB0" opacity="0.7"/>
</svg>
