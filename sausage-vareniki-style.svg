<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 140">
  <defs>
    <clipPath id="sausageShape">
      <!-- Sausage body: vertical cylinder with rounded ends and pinched string ties at top and bottom -->
      <path fill-rule="evenodd" d="
        M 17.5 4
        C 17.5 4 22 5 24 8
        C 26 11 26.5 15 26.5 17
        L 26.5 123
        C 26.5 125 26 129 24 132
        C 22 135 17.5 136 17.5 136
        C 17.5 136 13 135 11 132
        C 9 129 8.5 125 8.5 123
        L 8.5 17
        C 8.5 15 9 11 11 8
        C 13 5 17.5 4 17.5 4
        Z
      "/>
    </clipPath>
    <clipPath id="tieTopClip">
      <ellipse cx="17.5" cy="9" rx="5.5" ry="4"/>
    </clipPath>
    <clipPath id="tieBotClip">
      <ellipse cx="17.5" cy="131" rx="5.5" ry="4"/>
    </clipPath>
  </defs>

  <!-- ══ ТЕЛО КОЛБАСЫ ══ -->
  <g clip-path="url(#sausageShape)">

    <!-- База -->
    <rect x="6" y="2" width="24" height="138" fill="#D9A24E"/>

    <!-- Тёмные горизонтальные зоны (тень) -->
    <path fill="#BE872F" d="M 6 10 C 14 7 22 11 32 9 L 32 19 C 21 22 13 18 6 20 Z"/>
    <path fill="#C28B32" d="M 6 36 C 15 33 23 38 32 35 L 32 46 C 22 49 14 44 6 47 Z"/>
    <path fill="#C99139" d="M 6 62 C 16 58 24 64 32 61 L 32 72 C 23 75 15 70 6 73 Z"/>
    <path fill="#BE872F" d="M 6 90 C 14 87 22 93 32 90 L 32 100 C 21 103 13 98 6 101 Z"/>
    <path fill="#C28B32" d="M 6 116 C 15 113 23 118 32 115 L 32 126 C 22 129 14 124 6 127 Z"/>

    <!-- Светлые горизонтальные зоны (свет) -->
    <path fill="#E4B45F" d="M 6 23 C 15 20 23 25 32 22 L 32 31 C 21 34 13 29 6 32 Z"/>
    <path fill="#EBBE6C" d="M 6 49 C 16 46 24 51 32 48 L 32 57 C 23 60 15 55 6 58 Z"/>
    <path fill="#E4B45F" d="M 6 76 C 14 73 22 78 32 75 L 32 85 C 21 88 13 83 6 86 Z"/>
    <path fill="#EBBE6C" d="M 6 104 C 15 101 23 106 32 103 L 32 112 C 22 115 14 110 6 113 Z"/>

    <!-- Горизонтальные волокна -->
    <g stroke="#A9742450" fill="none" stroke-width="0.5" stroke-linecap="round">
      <path d="M 6 6  C 14 8  24 5  32 7"/>
      <path d="M 6 15 C 15 13 25 17 32 14"/>
      <path d="M 6 27 C 14 29 23 26 32 28" stroke-width="0.4" opacity="0.7"/>
      <path d="M 6 39 C 16 37 25 41 32 38"/>
      <path d="M 6 52 C 15 54 24 51 32 53"/>
      <path d="M 6 64 C 14 66 23 63 32 65" stroke-width="0.4" opacity="0.7"/>
      <path d="M 6 75 C 16 73 25 77 32 74"/>
      <path d="M 6 87 C 15 89 24 86 32 88"/>
      <path d="M 6 98 C 14 96 23 100 32 97" stroke-width="0.4" opacity="0.7"/>
      <path d="M 6 110 C 16 112 25 109 32 111"/>
      <path d="M 6 122 C 15 120 24 124 32 121"/>
      <path d="M 6 132 C 14 134 23 131 32 133" stroke-width="0.4" opacity="0.7"/>
    </g>

    <!-- Сучки -->
    <ellipse cx="24" cy="55" rx="2.2" ry="1.4" fill="#AB7726" opacity="0.6"/>
    <ellipse cx="11" cy="88" rx="1.7" ry="1.1" fill="#AB7726" opacity="0.5"/>
    <ellipse cx="20" cy="112" rx="1.4" ry="0.9" fill="#E8BC68" opacity="0.5"/>
  </g>

  <!-- ══ ПЕРЕВЯЗКА СВЕРХУ ══ -->
  <!-- Шейка сужения -->
  <ellipse cx="17.5" cy="14" rx="4.8" ry="2.5" fill="#C07820" opacity="0.85"/>
  <!-- Узел/бугорок -->
  <ellipse cx="17.5" cy="9" rx="5" ry="4" fill="#A86820" opacity="0.9"/>
  <ellipse cx="16" cy="7.5" rx="1.8" ry="1.2" fill="#C88030" opacity="0.55"/>

  <!-- ══ ПЕРЕВЯЗКА СНИЗУ ══ -->
  <ellipse cx="17.5" cy="126" rx="4.8" ry="2.5" fill="#C07820" opacity="0.85"/>
  <ellipse cx="17.5" cy="131" rx="5" ry="4" fill="#A86820" opacity="0.9"/>
  <ellipse cx="16" cy="129.5" rx="1.8" ry="1.2" fill="#C88030" opacity="0.55"/>
</svg>
